services:
  postgres:
    image: postgres:15-alpine
    container_name: mojo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mojo_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mojo_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-mojo_db}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    command: postgres -c timezone=${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mojo_db_user} -d ${POSTGRES_DB:-mojo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mojo-central-net

  redis:
    image: redis:7-alpine
    container_name: mojo-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-mojo_redis_password}"]
    volumes:
      - ./data/redis:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mojo_redis_password}
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mojo_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mojo-central-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  mojo-central-net:
    external: true
