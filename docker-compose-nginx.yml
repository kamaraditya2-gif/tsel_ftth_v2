services:
  nginx:
    image: nginx:alpine
    container_name: mojojojo_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - mojojojo_network

  # Auto-renew Let's Encrypt certificate (opsional, hanya untuk public domain)
  certbot:
    image: certbot/certbot
    container_name: mojojojo_certbot
    restart: unless-stopped
    entrypoint: ""
    command: >
      sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done
      "
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./data/certbot:/var/www/certbot
    profiles:
      - letsencrypt

networks:
  mojojojo_network:
    external: true
    name: mojojojomonitor_mojojojo_network
