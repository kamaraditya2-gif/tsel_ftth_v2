services:
  mojo_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-mojojojo_postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojojojo_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojojojo_password}
      DB_NAME: ${DB_NAME:-mojojojo_database}
      REDIS_HOST: ${REDIS_HOST:-mojojojo_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojojojo_network

networks:
  mojojojo_network:
    external: true
