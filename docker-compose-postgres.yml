services:
  postgres:
    image: postgres:15-alpine
    container_name: mojo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mojo_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mojo_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-mojo_db}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command: postgres -c timezone=${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mojo_db_user} -d ${POSTGRES_DB:-mojo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mojo-central-net

networks:
  mojo-central-net:
    external: true
