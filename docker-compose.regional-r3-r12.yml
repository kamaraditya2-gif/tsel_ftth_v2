services:
  fping_r03_jabotabek:
    image: mojo-worker:latest
    container_name: fping_r03_jabotabek
    restart: always
    cap_add:
      - NET_RAW
    command: ["node", "start-direct-ping-worker.js"]
    environment:
      DB_HOST: mojo-db
      DB_PORT: 5432
      DB_USER: mojo_db_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: mojo_db
      REDIS_HOST: mojo-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOWNSTREAM_SERVER_ID: 3
      DIRECT_PING_INTERVAL_MINUTES: 5
    networks:
      - mojo-central-net

  fping_r12_jabodetabek:
    image: mojo-worker:latest
    container_name: fping_r12_jabodetabek
    restart: always
    cap_add:
      - NET_RAW
    command: ["node", "start-direct-ping-worker.js"]
    environment:
      DB_HOST: mojo-db
      DB_PORT: 5432
      DB_USER: mojo_db_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: mojo_db
      REDIS_HOST: mojo-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOWNSTREAM_SERVER_ID: 12
      DIRECT_PING_INTERVAL_MINUTES: 5
    networks:
      - mojo-central-net

networks:
  mojo-central-net:
    external: true
    name: mojo-central-net
