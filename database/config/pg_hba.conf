# =============================================================================
# pg_hba.conf — Mojo-DB standalone database
# =============================================================================
# TYPE  DATABASE  USER  ADDRESS  METHOD
#
# Koneksi dibaca dari atas ke bawah; baris pertama yang cocok dipakai.
# Setelah mengubah file ini:  docker compose exec db psql -U <user> -c "SELECT pg_reload_conf()"
# =============================================================================

# Socket lokal di dalam container (healthcheck, psql via `docker compose exec`)
local   all       all                      trust
host    all       all   127.0.0.1/32       scram-sha-256
host    all       all   ::1/128            scram-sha-256

# Jaringan docker internal (service migrate)
host    all       all   172.16.0.0/12      scram-sha-256

# Server aplikasi (dashboard, dispatcher, worker pusat) di jaringan privat
host    all       all   10.0.0.0/8         scram-sha-256
host    all       all   192.168.0.0/16     scram-sha-256

# Worker regional yang terhubung lewat IP publik.
# Untuk produksi, GANTI baris di bawah dengan IP regional satu per satu, contoh:
#   host  mojo_db  mojo_db_user  103.143.12.120/32  scram-sha-256
host    all       all   0.0.0.0/0          scram-sha-256
