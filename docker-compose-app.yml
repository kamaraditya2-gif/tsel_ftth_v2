services:
  mojo_worker_fast:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    environment:
      QUEUE_NAME: acs-fast
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojo-central-net

  mojo_worker_download:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    environment:
      QUEUE_NAME: acs-download
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojo-central-net

  mojo_worker_upload:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    environment:
      QUEUE_NAME: acs-upload
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojo-central-net

  mojo_dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: mojo-dashboard:latest
    container_name: mojo-central-dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-3002}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://localhost:3000}
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mojo_redis_password}
      # Token bearer untuk /api/edge/* — kosong = endpoint edge menolak semua request
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:-}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - mojo-central-net

networks:
  mojo-central-net:
    external: true
