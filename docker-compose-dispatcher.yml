services:
  mojo_dispatcher:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    command: ["node", "dispatcher.js"]
    environment:
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojo-central-net

networks:
  mojo-central-net:
    external: true
