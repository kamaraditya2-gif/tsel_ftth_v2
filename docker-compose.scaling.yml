# Scaling-only compose file used by the dashboard container.
# It mirrors the worker service definitions from the main compose file
# (without depends_on/build context issues) so scaling actions do not
# touch postgres, redis, or dashboard containers.
#
# Usage from inside the dashboard container:
#   COMPOSE_PROJECT_NAME=mojo-central docker-compose -f /app/docker-compose.scaling.yml up -d --scale mojo_worker_fast=2 mojo_worker_fast

services:
  mojo_worker_fast:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mojo-worker:latest
    restart: always
    command: ["node", "worker.js"]
    environment:
      QUEUE_NAME: acs-fast
      DB_HOST: ${DB_HOST:-mojo-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mojo_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-mojo_db_password}
      DB_NAME: ${DB_NAME:-mojo_db}
      REDIS_HOST: ${REDIS_HOST:-mojo-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mojo_redis_password}
      API_BASE_URL: ${API_BASE_URL:-http://mojo-central-dashboard:3000}
      PING_RATE_LIMIT_SECONDS: ${PING_RATE_LIMIT_SECONDS:-10}
      SPEED_RATE_LIMIT_SECONDS: ${SPEED_RATE_LIMIT_SECONDS:-10}
      AXIROS_CONFIG_TTL_MS: ${AXIROS_CONFIG_TTL_MS:-60000}
      TZ: ${TZ:-Asia/Jakarta}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - mojo-central-net

  mojo_worker_download:
    build:
      context: ./worker
